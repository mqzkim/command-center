<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — 김진규</title>
<script src="data.js"></script>
<script src="galaxy-data.js"></script> <!-- 전 점 실명 목록 (build-galaxy.mjs 생성) -->
<script src="projects-data.js"></script> <!-- 프로젝트 레지스트리 (build-projects.mjs 생성) -->
<style>
/* ============================================================
   COMMAND CENTER v3 — 비주얼 세컨드 브레인 (갤럭시 뷰)
   중심 CLAUDE.MD · SKILLS 링 · 위키 섹터 나선 · 궤도 링(MEMORY/
   ROUTINES/APPLICATIONS). 데이터는 전부 CC_DATA(data.js).
   자족형: 외부 리소스 0. 캔버스 2D + DOM 패널.
   ============================================================ */
:root {
  --bg: #0b0812; --panel: #14101d; --panel-2: #1b1626; --line: #2a2338;
  --text: #eae6f2; --muted: #8d86a0; --dim: #5a5470;
  --orange: #ff7a1a; --violet: #9d7bff; --blue: #4da3ff;
  --mono: "Cascadia Code", Consolas, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
}
/* 이 뷰는 다크 네이티브. 라이트 모드에서는 UI 패널만 밝게 보정. */
@media (prefers-color-scheme: light) {
  :root { --panel: #1a1526; --panel-2: #241d33; --line: #37304a; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); }
#space { position: fixed; inset: 0; display: block; cursor: grab; }
#space.drag { cursor: grabbing; }

/* ---- 상단 좌측 브랜드 ---- */
.brand {
  position: fixed; top: 16px; left: 20px; z-index: 20;
  display: flex; align-items: center; gap: 10px; pointer-events: none;
}
.brand .hex { width: 26px; height: 26px; }
.brand b { font-size: 13px; letter-spacing: .28em; font-weight: 600; }
.brand small { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .1em; }

/* ---- 상단 우측: 검색 + 메뉴 ---- */
.hud { position: fixed; top: 14px; right: 16px; z-index: 20; display: flex; gap: 8px; }
.hud input {
  width: 220px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
  font: 12.5px var(--mono); padding: 8px 12px; border-radius: 8px; outline: none;
}
.hud input:focus { border-color: var(--orange); }
.hud button {
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  font: 600 11px var(--sans); letter-spacing: .12em; padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
.hud button:hover { color: var(--text); border-color: var(--orange); }

/* ---- 우측 상세 패널 ---- */
#detail {
  position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 30;
  background: color-mix(in oklab, var(--panel) 92%, transparent);
  backdrop-filter: blur(8px); border-left: 1px solid var(--line);
  padding: 22px; transform: translateX(105%); transition: transform .22s ease;
  overflow-y: auto;
}
#detail.open { transform: none; }
#detail .kind { font: 600 10px var(--mono); letter-spacing: .22em; margin-bottom: 8px; }
#detail h3 { font-size: 18px; letter-spacing: -.01em; margin-bottom: 4px; }
#detail .path { font: 11px var(--mono); color: var(--muted); word-break: break-all; margin-bottom: 14px; }
#detail p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
#detail .row { display: flex; gap: 8px; }
#detail button, .drawer .act {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  font: 550 12px var(--sans); padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
#detail button:hover, .drawer .act:hover { border-color: var(--orange); color: var(--orange); }
#detail .close { position: absolute; top: 14px; right: 14px; border: 0; background: none; color: var(--muted); font-size: 16px; }

/* ---- 좌측 브리핑 드로어 ---- */
#briefBtn {
  position: fixed; bottom: 18px; left: 20px; z-index: 20;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  font: 600 11.5px var(--sans); letter-spacing: .1em; padding: 10px 16px; border-radius: 10px; cursor: pointer;
}
#briefBtn:hover { border-color: var(--orange); }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 360px; z-index: 30;
  background: color-mix(in oklab, var(--panel) 94%, transparent);
  backdrop-filter: blur(8px); border-right: 1px solid var(--line);
  padding: 20px 22px; transform: translateX(-105%); transition: transform .22s ease; overflow-y: auto;
}
.drawer.open { transform: none; }
.drawer h2 { font: 600 11px var(--mono); letter-spacing: .24em; color: var(--orange); margin: 18px 0 8px; }
.drawer h2:first-of-type { margin-top: 6px; }
.drawer li { list-style: none; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.drawer li:first-child { border-top: 0; }
.drawer .s { font: 11px var(--mono); color: var(--muted); display: block; margin-top: 1px; }
.drawer .why { font-size: 11.5px; color: var(--orange); display: block; }
.drawer .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.drawer .close { position: absolute; top: 12px; right: 14px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
.drawer .meta { font: 10.5px var(--mono); color: var(--dim); margin-top: 16px; }

/* ---- 하단 KPI 스트립 ---- */
.kpis {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden;
}
.kpi { background: var(--panel); padding: 8px 18px; text-align: center; }
.kpi .n { font: 650 17px var(--mono); }
.kpi .n.warn { color: var(--orange); }
.kpi .l { font-size: 9.5px; color: var(--muted); letter-spacing: .08em; }

/* ---- 툴팁 / 토스트 ---- */
#tip {
  position: fixed; z-index: 40; pointer-events: none; opacity: 0;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 10px; font: 11.5px var(--mono); color: var(--text); white-space: nowrap;
  transition: opacity .1s;
}
#toast {
  position: fixed; bottom: 70px; left: 50%; transform: translate(-50%, 12px); z-index: 50;
  background: var(--panel); border: 1px solid var(--orange); border-radius: 10px;
  padding: 9px 16px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast b { color: var(--orange); }
/* ---- PROJECTS 뷰 (토스 블루 계열) ---- */
:root { --toss: #3b8cff; --toss-deep: #0064FF; --mint: #2ee6a8; --gold: #ffd23e; }
.hud button.on { color: #fff; border-color: var(--toss); background: #14305e; }
#detail { width: 380px; }
#detail .extra { font-size: 12px; color: var(--muted); }
#detail .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
#detail .chip { font: 11px var(--mono); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
#detail .chip.toss { border-color: var(--toss); color: #8ab8ff; }
#detail .chip.warn { border-color: var(--orange); color: var(--orange); }
#detail .chip.ok { border-color: var(--mint); color: var(--mint); }
#detail .chip.gold { border-color: var(--gold); color: var(--gold); }
/* ---- Claude OS 라이브 패널 ---- */
.cos-ok { color: var(--mint) !important; } .cos-off { color: var(--orange) !important; } .cos-dim { color: var(--muted); }
.cos-sub { font: 600 10px var(--mono); letter-spacing: .15em; color: var(--muted); margin: 8px 0 4px; }
#cosQ { width: 100%; box-sizing: border-box; margin: 8px 0 6px; padding: 7px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: 12px var(--sans); }
#cosQ:focus { outline: none; border-color: var(--orange); }
.cos-row { display: flex; gap: 8px; margin-top: 8px; }
#detail .cos-inline { margin-top: 8px; } #detail .cos-inline li { margin: 4px 0; font-size: 11.5px; } #detail .cos-inline .s, #detail .cos-inline .why { display: block; color: var(--muted); font: 10.5px var(--mono); }
#detail .pipe { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 0 0 12px; }
#detail .pipe div { height: 20px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); font: 8.5px var(--mono);
  display: flex; align-items: center; justify-content: center; color: var(--dim); overflow: hidden; white-space: nowrap; padding: 0 2px; }
#detail .pipe .pass { background: #123b2e; border-color: var(--mint); color: var(--mint); }
#detail .pipe .blocked { background: #3a1f10; border-color: var(--orange); color: var(--orange); }
#detail .pipe .next { border-color: var(--toss); color: #8ab8ff; box-shadow: 0 0 6px var(--toss); }
#detail h4 { font: 600 10px var(--mono); letter-spacing: .2em; color: var(--muted); margin: 12px 0 6px; }
#detail ul { list-style: none; }
#detail li { font-size: 12px; line-height: 1.5; padding: 4px 0; border-top: 1px solid var(--line); color: var(--text); }
#detail li .s { font: 10.5px var(--mono); color: var(--muted); display: block; }
#detail li.warn::before { content: "▲ "; color: var(--orange); }
#detail a { color: #8ab8ff; text-decoration: none; word-break: break-all; }
#detail a:hover { text-decoration: underline; }
#detail .src { font: 10px var(--mono); color: var(--dim); margin-top: 14px; word-break: break-all; }
.drawer h2.toss { color: var(--toss); }
.drawer .stg { display: flex; gap: 6px; flex-wrap: wrap; margin: 3px 0 2px; }
.drawer .pj { font: 11px var(--mono); padding: 2px 7px; border: 1px solid #3b8cff66; border-radius: 6px; color: #8ab8ff; cursor: pointer; background: none; }
.drawer .pj:hover { border-color: var(--toss); color: #fff; }
.drawer .pj.warn { border-color: #ff7a1a88; color: var(--orange); }
.drawer .pj.rel { border-color: #ffd23e88; color: var(--gold); }
.drawer .pj.unv { border-style: dashed; border-color: #7f8db0; color: #9aa6c4; }
.drawer .pj i { font-style: normal; opacity: .7; }
/* ---- 검색 결과 드롭다운 ---- */
.searchWrap { position: relative; }
#searchResults {
  position: absolute; top: 38px; right: 0; width: 320px; max-height: 380px; overflow-y: auto;
  background: color-mix(in oklab, var(--panel) 96%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 10px; display: none; z-index: 45;
}
#searchResults.show { display: block; }
#searchResults .sr {
  display: flex; align-items: center; gap: 9px; padding: 8px 12px; cursor: pointer;
  border-top: 1px solid var(--line); font-size: 12.5px;
}
#searchResults .sr:first-child { border-top: 0; }
#searchResults .sr:hover { background: var(--panel-2); }
#searchResults .sr .dot2 { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#searchResults .sr .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#searchResults .sr .pp { font: 10px var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- ☰ MENU 설정 패널 ---- */
#menu {
  position: fixed; top: 58px; right: 16px; width: 250px; z-index: 44;
  background: color-mix(in oklab, var(--panel) 96%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: none;
}
#menu.show { display: block; }
#menu label { display: flex; justify-content: space-between; align-items: center; font: 11px var(--mono); color: var(--muted); margin: 10px 0 4px; }
#menu label b { color: var(--orange); font-weight: 600; }
#menu input[type=range] { width: 100%; accent-color: var(--orange); }
#menu .chk { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 12.5px; }
#menu .chk input { accent-color: var(--orange); }
#menu .mrow { display: flex; gap: 8px; margin-top: 12px; }
#menu .mrow button { flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font: 550 11.5px var(--sans); padding: 7px 0; border-radius: 8px; cursor: pointer; }
#menu .mrow button:hover { border-color: var(--orange); color: var(--orange); }

/* ---- 문서 본문 뷰어 ---- */
#detail .doc { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; font-size: 12.5px; line-height: 1.65; color: var(--text); }
#detail .doc h1, #detail .doc h2, #detail .doc h3 { font-size: 13.5px; margin: 14px 0 6px; color: var(--orange); }
#detail .doc h1 { font-size: 15px; }
#detail .doc p { white-space: normal; margin-bottom: 8px; color: var(--text); }
#detail .doc ul, #detail .doc ol { padding-left: 18px; margin-bottom: 8px; }
#detail .doc li { margin: 2px 0; }
#detail .doc code { font: 11px var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
#detail .doc pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; margin-bottom: 8px; }
#detail .doc pre code { background: none; padding: 0; }
#detail .doc blockquote { border-left: 3px solid var(--violet); padding-left: 10px; color: var(--muted); margin-bottom: 8px; }
#detail .doc hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
#detail .doc table { border-collapse: collapse; font-size: 11.5px; margin-bottom: 8px; display: block; overflow-x: auto; }
#detail .doc td, #detail .doc th { border: 1px solid var(--line); padding: 3px 8px; }
#detail .loading { color: var(--dim); font: 11px var(--mono); padding: 10px 0; }

.kpis { cursor: pointer; }
.kpis:hover { border-color: var(--orange); }
@media (max-width: 760px) { .hud input { width: 130px; } #detail, .drawer { width: 88vw; } #searchResults { width: 78vw; } }
</style>
</head>
<body>
<canvas id="space"></canvas>

<div class="brand">
  <svg class="hex" viewBox="0 0 48 48" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M24 6l18 10v16L24 42 6 32V16Z"/><path d="M6 16l18 10 18-10" opacity=".6"/><path d="M24 26v16" opacity=".6"/>
  </svg>
  <b>COMMAND CENTER<small id="brandSub"></small></b>
</div>

<div class="hud">
  <div class="searchWrap">
    <input id="search" type="search" placeholder="search nodes…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <button id="viewToggle" type="button" title="갤럭시 ↔ 프로젝트 뷰 전환">▦ PROJECTS</button>
  <button id="menuBtn" type="button">☰ MENU</button>
  <button id="resetView" type="button">RESET</button>
</div>

<div id="menu">
  <label>RING SPIN <b id="vSpin"></b></label>
  <input type="range" id="sSpin" min="0" max="3" step="0.1">
  <label>NODE SIZE <b id="vDot"></b></label>
  <input type="range" id="sDot" min="0.5" max="2" step="0.05">
  <label>LINK WEB <b id="vLinks"></b></label>
  <input type="range" id="sLinks" min="0" max="3" step="0.1">
  <div class="chk"><input type="checkbox" id="sNames"><label for="sNames" style="margin:0">File names — 전 노드 라벨 상시 표시</label></div>
  <div class="mrow"><button id="bakeBtn" type="button">Bake settings</button><button id="defBtn" type="button">Defaults</button></div>
</div>

<aside id="detail">
  <button class="close" type="button" aria-label="닫기">✕</button>
  <div class="kind"></div><h3></h3><div class="path"></div><p></p>
  <div class="row"><button id="copyPath" type="button">Copy path</button><button id="openRaw" type="button">원문 보기</button><button id="openGh" type="button">GitHub 열기</button><button id="copyPrompt" type="button">Claude Code로 이어서</button></div>
  <div class="extra"></div>
</aside>

<button id="briefBtn" type="button">☰ 오늘의 브리핑</button>
<aside class="drawer" id="drawer">
  <button class="close" type="button" aria-label="닫기">✕</button>
  <div id="drawerBody"></div>
</aside>

<div class="kpis" id="kpis"></div>
<div id="tip"></div>
<div id="toast"></div>

<script>
"use strict";
/* 런타임 에러 카운터 — 헤드리스 --dump-dom 검증용 (body[data-errors]) */
addEventListener("error", e => { document.body.dataset.errors = (+(document.body.dataset.errors || 0)) + 1; document.body.dataset.lastError = String(e.message).slice(0, 200); });
const D = CC_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#brandSub").textContent = D.meta.owner + " · " + D.meta.lastUpdated;

/* ═══════════════ 모델: CC_DATA → 노드(정적 극좌표) ═══════════════ */
const G = D.galaxy;
const TAU = Math.PI * 2;
const nodes = [];   // {ring, r, a, size, color, label, kind, desc, path, glow}
const labels = [];  // 항상 그리는 텍스트 {ring, r, a, text, color, size, ls}

/* 중심 */
nodes.push({ ring: "center", r: 0, a: 0, size: 17, color: "#ff7a1a", label: G.center.label,
  kind: "CENTER", path: G.center.path, glow: 26,
  desc: G.center.desc || "모든 에이전트가 읽는 마스터 라우터. 워크스페이스의 항성." });

/* SKILLS — 주황 스파크 3중 링 */
G.skills.items.forEach((sk, i) => {
  const ring = i % 3, per = Math.ceil(G.skills.items.length / 3);
  const name = sk.n || sk;
  nodes.push({ ring: "skills", r: 74 + ring * 15, a: ((i / 3) | 0) / per * TAU + ring * 0.35,
    size: 3.4, color: "#ff7a1a", label: name, kind: "SKILL", spark: true, glow: 8,
    path: sk.p || null,
    desc: (sk.d ? sk.d + " — " : "") + `호출: Skill 도구 또는 /${name.split(":").pop()}` });
});
labels.push({ ring: "skills", r: 122, a: -TAU / 4, text: "SKILLS", color: "#ff7a1a", size: 15, ls: 4 });

/* 위키 섹터 — 동심 점 나선 */
const NS = G.sectors.length, SPAN = TAU / NS * 0.8;
const ITEMS = typeof CC_GALAXY_ITEMS !== "undefined" ? CC_GALAXY_ITEMS : {};
G.sectors.forEach((sec, si) => {
  const ac = si / NS * TAU - TAU / 4 + TAU / NS / 2;
  /* 실명 목록(디스크 스캔)이 있으면 전 점 실명 + 실측 count 갱신, 없으면 대표 실명만 */
  const items = ITEMS[sec.name] || null;
  const total = items ? items.length : sec.count;
  sec.count = total;
  let placed = 0, row = 0;
  while (placed < total && row < 16) {
    const r = 152 + row * 15.5;
    const cap = Math.max(4, Math.floor(SPAN * r / 13));
    const take = Math.min(cap, total - placed);
    for (let j = 0; j < take; j++) {
      const a = ac - SPAN / 2 + (j + 0.5) / cap * SPAN;
      const it = items ? items[placed] : null;
      /* PROJECTS 등 스캔 밖 섹터는 D.projects 실측 설명으로 폴백 */
      const proj = !it && sec.name === "PROJECTS" ? D.projects[placed] : null;
      const named = it ? it.t : (proj ? proj.name : (sec.named[placed] || null));
      nodes.push({ ring: "sector", r, a, size: Math.max(1.6, 4.6 - row * 0.28), color: sec.color,
        label: named, kind: named ? "DOC" : null, sector: sec.name, glow: named ? 8 : 5,
        rel: it ? it.p : null,
        path: it ? "~/.wiki/" + it.p : (proj ? proj.path : (named ? sec.root : null)),
        desc: it
          ? (it.d ? it.d + "\n\n" : "") + `수정 ${it.m} · ${it.s}KB · ${it.p}`
          : (proj ? proj.desc + ` (status: ${proj.status})` : (named ? `${sec.name} 문서.` : null)) });
      placed++;
    }
    row++;
  }
  if (placed < total) console.warn(sec.name, "미배치", total - placed);
  /* 카테고리 노드 + 라벨 + 총계 (+최근 변경 top3) */
  const recent = items
    ? [...items].sort((a, b) => b.m.localeCompare(a.m)).slice(0, 3).map(x => `· ${x.m} ${x.t}`).join("\n")
    : "";
  nodes.push({ ring: "sector", r: 137, a: ac, size: 9, color: sec.color, label: sec.name,
    kind: "CATEGORY", path: sec.root, glow: 16,
    desc: `${sec.name} — ${sec.count}건 (디스크 실측). 모든 점이 실명 문서.`
      + (recent ? `\n\n최근 변경:\n${recent}` : "") });
  labels.push({ ring: "sector", r: 137, a: ac, text: sec.name, color: sec.color, size: 10, ls: 2, dy: -20 });

    ctx.globalAlpha = 1;
  });

  /* 고정 라벨 */
  labels.forEach(L => {
    const a = L.a + ringAngle(L.ring === "orbit" ? "none" : L.ring, t);
    const x = W / 2 + panX + Math.cos(a) * L.r * zoom;
    const y = H / 2 + panY + Math.sin(a) * L.r * zoom + (L.dy || 0) * zoom;
    ctx.globalAlpha = dimmed ? 0.25 : 1;
    ctx.fillStyle = L.color;
    ctx.font = `${L.mono ? 650 : 600} ${L.size * Math.max(zoom, 0.75)}px ${L.mono ? '"Cascadia Code", monospace' : '"Segoe UI"'}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (L.ls) { ctx.save(); ctx.letterSpacing = L.ls + "px"; ctx.fillText(L.text, x, y); ctx.restore(); }
    else ctx.fillText(L.text, x, y);
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ═══════════════ 인터랙션 ═══════════════ */
let dragging = false, lx = 0, ly = 0, moved = 0;
cv.addEventListener("pointerdown", e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; cv.classList.add("drag"); });
addEventListener("pointerup", () => { dragging = false; cv.classList.remove("drag"); });
cv.addEventListener("pointermove", e => {
  if (dragging) {
    panX += e.clientX - lx; panY += e.clientY - ly; moved += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
    lx = e.clientX; ly = e.clientY; return;
  }
  const t = performance.now() / 1000;
  hover = pick(e.clientX, e.clientY, t);
  const tip = $("#tip");
  if (hover && hover.label) {
    tip.textContent = hover.label;
    tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
    tip.style.opacity = 1; cv.style.cursor = "pointer";
  } else { tip.style.opacity = 0; cv.style.cursor = ""; }
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoom = Math.min(4, Math.max(0.35, zoom * f));
}, { passive: false });
cv.addEventListener("click", e => {
  if (moved > 6) return;
  const n = pick(e.clientX, e.clientY, performance.now() / 1000);
  if (n && n.kind) openDetail(n); else closeDetail();
});
function pick(mx, my, t) {
  let best = null, bd = 1e9;
  for (const n of nodes) {
    if (!n.label) continue;
    const [x, y] = toScreen(n, t);
    const d = Math.hypot(mx - x, my - y);
    const rad = n.pickR ? n.pickR * zoom : Math.max(9, n.size * zoom + 5);
    if (d < rad && d < bd) { bd = d; best = n; }
  }
  return best;
}

/* 문서 본문 뷰어 — wiki junction(~/.wiki 서빙)에서 fetch, 마크다운 렌더 */
function md2html(src) {
  src = src.replace(/^---\n[\s\S]*?\n---\n/, "");
  const esc2 = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inline = s => esc2(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[\[([^\]]+)\]\]/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 <span style="color:var(--dim)">($2)</span>');
  const out = []; let inCode = false, inList = false, inQuote = false;
  const closeAll = () => { if (inList) { out.push("</ul>"); inList = false; } if (inQuote) { out.push("</blockquote>"); inQuote = false; } };
  for (const line of src.split("\n")) {
    if (line.startsWith("```")) { closeAll(); out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue; }
    if (inCode) { out.push(esc2(line) + "\n"); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { closeAll(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { closeAll(); out.push("<hr>"); continue; }
    if (/^\s*[-*+]\s+/.test(line)) { if (inQuote) { out.push("</blockquote>"); inQuote = false; } if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${inline(line.replace(/^\s*[-*+]\s+/, ""))}</li>`); continue; }
    if (/^>\s?/.test(line)) { if (inList) { out.push("</ul>"); inList = false; } if (!inQuote) { out.push("<blockquote>"); inQuote = true; } out.push(inline(line.replace(/^>\s?/, "")) + "<br>"); continue; }
    if (line.startsWith("|")) { closeAll(); out.push(`<div style="font:10.5px var(--mono);color:var(--muted)">${esc2(line)}</div>`); continue; }
    closeAll();
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  closeAll(); if (inCode) out.push("</code></pre>");
  return out.join("");
}
async function loadDoc(n, box) {
  box.innerHTML = `<div class="loading">본문 로드 중… wiki/${esc(n.rel)}</div>`;
  try {
    const r = await fetch("wiki/" + encodeURI(n.rel));
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    if (selected !== n) return; /* 로드 중 다른 노드 선택 시 무시 */
    box.innerHTML = `<div class="doc">${md2html(text)}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="loading">본문 로드 실패 (${esc(String(e.message || e))}) — file:// 로 열었다면 http://localhost:7766 으로 접속해야 본문이 보입니다.</div>`;
  }
}

  const unverified = t && !t.source;

  else if (t) chips.push(`<span class="chip ${t.stage === "released" ? "gold" : "toss"}">${esc(PJ.stageKo[t.stage] || t.stage)}${t.nextCheck && t.nextCheck !== t.stage ? " → " + esc(PJ.stageKo[t.nextCheck] || t.nextCheck) : ""}</span>`);
  if (t && t.blockersOpen > 0) chips.push(`<span class="chip warn">블로커 ${t.blockersOpen}</span>`);
  if (t && t.blockersOpen === 0 && t.source) chips.push(`<span class="chip ok">블로커 없음</span>`);
  if (p.lastActivity) chips.push(`<span class="chip">${esc(p.lastActivity)} · ${p.daysSince}일 전</span>`);

  if (gh) chips.push(`<span class="chip">${gh.private ? "private" : "public"} · 이슈 ${gh.openIssues} · 30일 커밋 ${gh.commits30d}</span>`);
  if (p.lang) chips.push(`<span class="chip">${esc(p.lang)}</span>`);
  if (t && t.classification) chips.push(`<span class="chip">${esc(t.classification)}</span>`);
  let h = `<div class="chips">${chips.join("")}</div>`;
  if (unverified) {
    h += `<h4>단계 미확정 — 추정하지 않음</h4><ul><li class="warn">${esc(t.note || "launch-status.json 없음")}</li></ul>`;
    if (t.evidence && t.evidence.length) h += `<h4>관찰된 근거 (단계 판정 아님)</h4><ul>${t.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;

      return `<div class="${cls}" title="${esc(s)}: ${esc(v)}">${esc(PJ.stageKo[s] || s)}</div>`;
    }).join("") + `</div>`;
    if (t.note) h += `<div class="src">${esc(t.note)}</div>`;
    if (t.blockers.length) h += `<h4>OPEN BLOCKERS · ${t.blockersOpen}</h4><ul>${t.blockers.map(b => `<li class="warn">${esc(b)}</li>`).join("")}</ul>`;
  }
  if (gh && gh.recent.length) h += `<h4>RECENT COMMITS</h4><ul>${gh.recent.map(c => `<li>${esc(c.message)}<span class="s">${esc(c.date)}</span></li>`).join("")}</ul>`;

  if (L.parent) links.push(`<li>모노레포 부모: <a href="#" data-open="${esc(L.parent)}">${esc(L.parent)}</a></li>`);

  h += `<div class="src">원천: ${esc(t && t.source ? t.source : (L.local || "gh 메타만"))}${gh ? " · gh " + esc(PJ.ghSnapshot || "") : ""}</div>`;
  return h;
}

/* ═══════════════ CLAUDE OS 라이브 (8051) — 전부 런타임 fetch, 오프라인 시 명시 렌더, 에러 0 ═══════════════ */
function cosBase() { return "http://localhost:8051"; }
async function cosFetch(path, body, ms) {
  const COS = cosBase();
  /* 상태 조회 3s, search-all은 ollama 임베딩으로 ~8s 실측 → 20s */
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms || 3000);
  try {
    const r = await fetch(COS + path, { signal: ac.signal, ...(body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}) });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; } finally { clearTimeout(t); }
}
function cosSnip(s) { return esc(String(s || "").replace(/\s+/g, " ").trim().slice(0, 120)); }
function cosTitle(r) { return (r.metadata && (r.metadata.title || r.metadata.filename)) || r.doc_id || "?"; }
async function cosSearchInto(box, query, topK) {
  box.innerHTML = `<li class="cos-dim">검색 중… "${esc(query)}"</li>`;
  const j = await cosFetch("/api/kb/search-all", { query, top_k: topK }, 20000);
  if (!j) { box.innerHTML = `<li class="cos-off">오프라인 — claude-os(8051) 응답 없음</li>`; return; }
  const rs = j.results || [];
  box.innerHTML = rs.length
    ? rs.map(r => `<li><b>${esc(cosTitle(r))}</b><span class="s">${esc(r.kb_name || "?")} · score ${(+r.score || 0).toFixed(3)}</span><span class="why">${cosSnip(r.text)}</span></li>`).join("")
    : `<li class="cos-dim">결과 0건 "${esc(query)}"</li>`;
}
async function cosPanelRefresh() {
  const st = $("#cosState"), kb = $("#cosKb"), mem = $("#cosMem");
  const h = await cosFetch("/health");
  if (!h) { st.textContent = "오프라인"; st.className = "s cos-off"; kb.innerHTML = `<li class="cos-off">오프라인 — http://localhost:8051 응답 없음 (start.ps1 필요)</li>`; mem.innerHTML = `<li class="cos-dim">—</li>`; return; }
  const c = h.components || {};
  st.textContent = `${h.status} · sqlite ${c.sqlite ? c.sqlite.status : "?"} · ollama ${c.ollama ? c.ollama.models_installed + " models" : "?"}`;
  st.className = "s " + (h.status === "healthy" ? "cos-ok" : "cos-off");
  const kbs = ((await cosFetch("/api/kb")) || {}).knowledge_bases || [];
  const mine = kbs.filter(k => /^command-center-/.test(k.name));
  if (!mine.length) { kb.innerHTML = `<li class="cos-dim">command-center-* KB 없음 (프로젝트 미생성)</li>`; }
  else {
    const stats = await Promise.all(mine.map(k => cosFetch(`/api/kb/${encodeURIComponent(k.name)}/stats`)));
    kb.innerHTML = mine.map((k, i) => `<li>${esc(k.name.replace(/^command-center-/, ""))}<span class="s">문서 ${stats[i] ? stats[i].total_documents : "?"} · 청크 ${stats[i] ? stats[i].total_chunks : "?"}</span></li>`).join("");
  }
  const docs = ((await cosFetch("/api/kb/command-center-project_memories/documents")) || {}).documents || [];
  const top = [...docs].sort((a, b) => String((b.metadata || b).upload_date || b.created_at || "").localeCompare(String((a.metadata || a).upload_date || a.created_at || ""))).slice(0, 5);
  mem.innerHTML = top.length
    ? top.map(d => `<li>${esc((d.metadata && d.metadata.title) || d.title || d.filename || d.id)}<span class="s">${esc(String((d.metadata || d).upload_date || d.created_at || "").slice(0, 16))}</span></li>`).join("")
    : `<li class="cos-dim">기억 0건 — "remember this"로 저장하면 여기 표시</li>`;
}
$("#cosQ").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) cosSearchInto($("#cosRes"), e.target.value.trim(), 8); });
cosPanelRefresh();
/* APPLICATIONS "Claude OS" 헥사곤 상세 — 라이브 health/KB/프로젝트 */
async function cosAppDetail(n, box) {
  box.innerHTML = `<div class="loading">claude-os 상태 조회 중…</div>`;
  const h = await cosFetch("/health");
  if (selected !== n) return;
  const btns = `<div class="row" style="margin-top:10px"><button type="button" data-cos-go="http://localhost:5173">5173 열기</button><button type="button" data-cos-go="http://localhost:8051/health">8051 health</button></div>`;
  if (!h) { box.innerHTML = `<div class="chips"><span class="chip warn">오프라인</span></div><div class="src">http://localhost:8051 응답 없음 — C:\\workspace\\claude-os\\start.ps1 로 기동</div>${btns}`; return; }
  const [kbj, pj] = await Promise.all([cosFetch("/api/kb"), cosFetch("/api/projects")]);
  if (selected !== n) return;
  const c = h.components || {}, sq = c.sqlite || {}, ol = c.ollama || {};
  const kbs = (kbj && kbj.knowledge_bases) || [], prs = (pj && pj.projects) || [];
  box.innerHTML = `<div class="chips"><span class="chip ${h.status === "healthy" ? "ok" : "warn"}">${esc(h.status)}</span><span class="chip">sqlite ${esc(sq.status || "?")} · tables ${esc(sq.tables ?? "?")}</span><span class="chip">ollama ${esc(ol.status || "?")} · models ${esc(ol.models_installed ?? "?")}</span><span class="chip">KB ${kbs.length}</span><span class="chip">프로젝트 ${prs.length}</span></div>`
    + `<h4>PROJECTS</h4><ul>${prs.map(p => `<li>${esc(p.name)}<span class="s">${esc(p.path || "")}</span></li>`).join("") || "<li>없음</li>"}</ul>`
    + `<h4>KNOWLEDGE BASES · ${kbs.length}</h4><ul>${kbs.map(k => `<li>${esc(k.name)}</li>`).join("")}</ul>`
    + `<div class="src">실측 ${esc(h.timestamp || "")} · GET /health, /api/kb, /api/projects</div>` + btns;
}
$("#detail").addEventListener("click", e => { const g = e.target.closest("[data-cos-go]"); if (g) window.open(g.dataset.cosGo, "_blank", "noopener"); });

$("#kpis").addEventListener("click", () => $("#drawer").classList.add("open"));

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
}
function toast(msg) {
  const el = $("#toast"); el.innerHTML = `<b>✓</b> ${esc(msg)}`;
  el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200);
}
